<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#f8fafc"/>

  <text x="450" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">Native BRE Invocation Chain</text>
  <text x="450" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Apex caller → BRE REST API → Expression Set → Decision Matrix</text>

  <!-- Apex Caller box -->
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="200" height="90" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="160" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4338ca" text-anchor="middle">Apex Caller</text>
    <text x="160" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">SalesforceBREClient</text>
    <text x="160" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Callable implementation</text>
    <text x="160" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">✅ Collects inputs, distributes outputs</text>
  </g>

  <!-- Arrow to BRE REST API -->
  <line x1="260" y1="155" x2="320" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="290" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">POST</text>

  <!-- BRE REST API box -->
  <g filter="url(#shadow)">
    <rect x="320" y="110" width="200" height="90" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="420" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4338ca" text-anchor="middle">BRE REST API</text>
    <text x="420" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">/async/expressionsets/</text>
    <text x="420" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">{expressionSetName}/invoke</text>
    <text x="420" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">✅ Session ID auth, async</text>
  </g>

  <!-- Arrow to Expression Set -->
  <line x1="520" y1="155" x2="580" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="550" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">routes to</text>

  <!-- Expression Set box -->
  <g filter="url(#shadow)">
    <rect x="580" y="90" width="260" height="130" rx="12" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
    <text x="710" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">Expression Set</text>
    <text x="710" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Chains decision logic</text>
    <!-- Steps -->
    <rect x="600" y="155" width="105" height="26" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="652" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">1. Lookup</text>
    <rect x="715" y="155" width="105" height="26" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="767" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">2. Condition</text>
    <rect x="600" y="188" width="105" height="26" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="652" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">3. Matrix</text>
    <rect x="715" y="188" width="105" height="26" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="767" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">4. Assign</text>
  </g>

  <!-- Arrow to Decision Matrix -->
  <line x1="710" y1="220" x2="710" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="724" y="247" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">lookup</text>

  <!-- Decision Matrix box -->
  <g filter="url(#shadow)">
    <rect x="530" y="265" width="360" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="710" y="295" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Decision Matrix</text>
    <text x="710" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Single-row exact match</text>
    <!-- Matrix structure -->
    <rect x="550" y="328" width="100" height="28" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="600" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Input Col A</text>
    <rect x="655" y="328" width="100" height="28" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="705" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Input Col B</text>
    <rect x="760" y="328" width="110" height="28" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="815" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Output Col C</text>
  </g>

  <!-- Return path -->
  <line x1="710" y1="365" x2="710" y2="405" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="724" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">result</text>

  <!-- Response path -->
  <g filter="url(#shadow)">
    <rect x="320" y="405" width="500" height="70" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="570" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#4338ca" text-anchor="middle">BRE Response: outcome + reason codes + MA factor</text>
    <text x="570" y="452" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Apex caller inspects response map, updates record, writes audit log</text>
  </g>

  <!-- Arrow back to Apex -->
  <line x1="320" y1="440" x2="260" y2="440" stroke="#64748b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="290" y="456" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">200 OK</text>

  <!-- Legend -->
  <g filter="url(#shadow)">
    <rect x="60" y="490" width="780" height="38" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="75" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#475569">Key points:</text>
    <text x="155" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">BRE has no trigger model</text>
    <circle cx="380" cy="511" r="4" fill="#ef4444"/>
    <text x="395" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Caller must detect record change</text>
    <circle cx="600" cy="511" r="4" fill="#ef4444"/>
    <text x="615" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Activation is always manual</text>
  </g>
</svg>
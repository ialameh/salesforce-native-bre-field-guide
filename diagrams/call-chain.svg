<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="900" height="480" fill="#f8fafc"/>

  <text x="450" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">Native BRE: Call Chain and Failure Modes</text>
  <text x="450" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Every broken invocation traces back to one of these gaps</text>

  <!-- Happy path column -->
  <text x="200" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Happy path</text>

  <g filter="url(#shadow)">
    <rect x="50" y="108" width="300" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="200" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">Draft activated</text>
    <text x="200" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">BRE UI shows green active badge</text>
  </g>

  <line x1="200" y1="168" x2="200" y2="192" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="50" y="192" width="300" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="200" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">Correct field names in input map</text>
    <text x="200" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Variable names match Expression Set inputs</text>
  </g>

  <line x1="200" y1="252" x2="200" y2="276" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="50" y="276" width="300" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="200" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#15803d" text-anchor="middle">BRE execution permission set</text>
    <text x="200" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">User assigned "BRE Execution" permission set</text>
  </g>

  <line x1="200" y1="336" x2="200" y2="360" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="50" y="360" width="300" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="200" y="384" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">200 OK — response returned</text>
    <text x="200" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">outcome, reason codes, MA factor</text>
  </g>

  <!-- Failure modes column -->
  <text x="600" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#dc2626" text-anchor="middle">Failure modes</text>

  <g filter="url(#shadow)">
    <rect x="470" y="108" width="380" height="55" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="490" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="left">404 Not Found</text>
    <text x="490" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="left">Draft not activated. Response: "Expression set not found."</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="172" width="380" height="55" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="490" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="left">400 Bad Request</text>
    <text x="490" y="214" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="left">Wrong field names in input map. Check variable names in BRE UI.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="236" width="380" height="55" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="490" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="left">403 Forbidden</text>
    <text x="490" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="left">Missing BRE execution permission set. Assign it to the calling user.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="300" width="380" height="55" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="490" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="left">500 Internal Server Error</text>
    <text x="490" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="left">Matrix row count > 100k. Too many nested Expression Sets. Logic error in rule.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="364" width="380" height="55" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="490" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626" text-anchor="left">No matching row</text>
    <text x="490" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="left">Input values outside matrix range. Add a catch-all row or handle null in Apex.</text>
  </g>

  <!-- Divider -->
  <line x1="400" y1="95" x2="400" y2="450" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Bottom note -->
  <text x="450" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">Simulate before activating. Check response field names before writing Apex caller.</text>
</svg>
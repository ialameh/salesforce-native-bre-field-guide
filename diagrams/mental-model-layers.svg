<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#f8fafc"/>

  <!-- Title -->
  <text x="450" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">Native Salesforce BRE: Three-Layer Architecture</text>
  <text x="450" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Definition → Activation → Invocation</text>

  <!-- Layer 1: Definition -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="820" height="140" rx="12" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  </g>
  <text x="460" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle">LAYER 1: Definition (What the rule says)</text>

  <!-- Definition boxes -->
  <g filter="url(#shadow)">
    <rect x="70" y="140" width="200" height="70" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="170" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">ExpressionSetDefinition</text>
    <text x="170" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Chains matrices + logic steps</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="290" y="140" width="200" height="70" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="390" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">DecisionMatrixDefinition</text>
    <text x="390" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Single-row exact match lookup</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="140" width="200" height="70" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="610" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">DecisionTableDefinition</text>
    <text x="610" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Multi-row range-based matching</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="730" y="140" width="110" height="70" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
    <text x="785" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Object &amp;</text>
    <text x="785" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1e40af" text-anchor="middle">Field Aliases</text>
  </g>

  <!-- Arrow down -->
  <line x1="450" y1="230" x2="450" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="450" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">manual activation</text>

  <!-- Layer 2: Activation -->
  <g filter="url(#shadow)">
    <rect x="40" y="285" width="820" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  </g>
  <text x="460" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">LAYER 2: Activation (Draft → Live)</text>

  <g filter="url(#shadow)">
    <rect x="150" y="335" width="250" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
    <text x="275" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle">Draft version — visible in BRE UI, not callable</text>
  </g>

  <line x1="400" y1="353" x2="480" y2="353" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="440" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">Activate</text>

  <g filter="url(#shadow)">
    <rect x="500" y="335" width="250" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="625" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Activated version — callable, handles invocations</text>
  </g>

  <text x="460" y="408" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-style="italic">Activation is always manual. No API or CLI can activate a BRE rule.</text>

  <!-- Arrow down -->
  <line x1="450" y1="402" x2="450" y2="427" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Invocation -->
  <g filter="url(#shadow)">
    <rect x="40" y="440" width="820" height="140" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  </g>
  <text x="460" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">LAYER 3: Invocation (How callers trigger rules)</text>

  <!-- Invocation boxes -->
  <g filter="url(#shadow)">
    <rect x="80" y="490" width="160" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="160" y="518" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Apex (Callable)</text>
    <text x="160" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">SalesforceBREClient</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="270" y="490" width="160" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="350" y="518" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">BRE REST API</text>
    <text x="350" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">POST /async/expressionsets/...</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="490" width="160" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="550" y="518" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Flow Builder</text>
    <text x="550" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">BRE Action element</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="670" y="490" width="160" height="70" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="750" y="518" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Integration Proc.</text>
    <text x="750" y="536" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Optional wrapper (legacy)</text>
  </g>

  <!-- Bottom key -->
  <text x="450" y="605" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Metadata types use Tooling API: ExpressionSetDefinition, DecisionMatrixDefinition, DecisionTableDefinition</text>
</svg>